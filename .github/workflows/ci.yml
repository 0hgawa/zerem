name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that does not fail the build is a warning nobody fixes.
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Slint's winit backend links against X11/Wayland and font headers.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev \
                                  libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
                                  libwayland-dev libfontconfig1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # The patched engine, which `cargo test --workspace` does not reach: it is
      # excluded from the workspace so our lints do not run over somebody else's
      # code. That exclusion also takes with it the only test that proves
      # protocol encryption works on a wire -- two sessions, both refusing to
      # speak in the clear, downloading from each other. The crate's tests bind
      # fixed ports, so they cannot share a machine with each other.
      #
      # Windows only, deliberately. The encryption is platform-independent and
      # its own nineteen tests run everywhere through the workspace; what this
      # adds is the integration, and running that twice buys a second copy of
      # the same answer for several minutes of build.
      - name: The patched engine
        if: runner.os == 'Windows'
        working-directory: vendor/librqbit
        run: cargo test --lib -- --test-threads=1

      # Compiled and not run. Criterion needs a stored baseline to say anything
      # about a regression, and a wall-clock threshold on a shared runner
      # measures the runner rather than the code — so what CI guards is the
      # scaling test in sort.rs, which compares two sizes against each other.
      # This step exists so the benches cannot rot while nobody runs them.
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

      # The binary is part of the product. The budget was 12 MB while the engine was
      # synthetic, then 16 once librqbit's 4.7 MB was real, then 17 for the country
      # table and the flags, then 18 for the loopback server that streams a file to a
      # media player. It is 19 now: signed self-update brings a blocking HTTP client,
      # the signature check and the swap, and cost 0.80 MB of the 0.92 that was left.
      # Every one of those steps bought a feature. Headroom stays thin on purpose — a
      # release that quietly doubles this should not merge, and 17.88 is where it sits.
      - name: Release build and size budget
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $mb = [math]::Round((Get-Item target/release/zerem.exe).Length / 1MB, 2)
          Write-Host "zerem.exe is $mb MB"
          if ($mb -gt 19) { throw "binary is $mb MB, over the 19 MB budget" }
