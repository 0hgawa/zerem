[package]
name = "zerem-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Zerem core — domain types, ordering and display formatting. No async, no I/O, no UI."

# Deliberately empty. The moment this crate needs a dependency, check that what
# is being added really belongs below the engine rather than inside it.
[dependencies]

[lints]
workspace = true

# Criterion only, and only for benches. The library's own dependency list stays
# empty — that is the rule this crate exists under, and a dev-dependency does
# not reach the shipped binary.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ordering"
harness = false
