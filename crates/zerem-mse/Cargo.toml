[package]
name = "zerem-mse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Message Stream Encryption — the BitTorrent protocol obfuscation every mainstream client speaks."

# Nothing new in the tree. SHA-1 and the random bytes come from ring and the
# modular exponentiation from num-bigint, both of which librqbit already links,
# so a whole protocol arrives at no cost in dependencies. RC4 is written out
# here rather than pulled in: it is twenty lines with published test vectors,
# and a crate for that is a supply chain for nothing.
[dependencies]
num-bigint = "0.4"
ring = "0.17"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
