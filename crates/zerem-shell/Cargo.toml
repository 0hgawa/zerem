[package]
name = "zerem-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Desktop plumbing — single instance, and the rest of what an installed app needs. Nothing Zerem-specific."

# Deliberately app-neutral: everything here is named by what it does, not by
# what Zerem calls it, so this can be promoted to a repository shared with Clipo
# and Vayou by moving the folder.
[dependencies]
tracing.workspace = true
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # CreateNamedPipeW takes SECURITY_ATTRIBUTES, ConnectNamedPipe takes OVERLAPPED.
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # Registry writes and the shell notification that refreshes associations.
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
