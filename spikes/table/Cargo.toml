# Its own workspace root: a spike keeps its lockfile and dependency tree to
# itself, and the app's manifest never has to know it exists.
[workspace]

[package]
name = "spike-table"
version = "0.0.0"
edition = "2021"
publish = false
description = "Zerem spike S0.1 + S0.3 — virtualised table under a 1 Hz snapshot tick."

[dependencies]
# femtovg so the rendering notifier yields a real GL context — that is how the
# frame counter measures actual repaints rather than guessing.
slint = { version = "1.16", features = ["backend-winit", "renderer-femtovg"] }

[build-dependencies]
slint-build = "1.16"

# The spike measures release behaviour. Debug numbers for a table diff are
# meaningless, so even the dev profile optimises dependencies.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Pedantic + nursery, with only the cast family allowed. Every value crossing
# into Slint changes width by necessity — byte counts are u64 and the progress
# bar takes f32, ids are u32 and Slint's `int` is i32 — so those casts are the
# interface, not a smell. Nothing else is waived; a new allow here needs its
# reason written next to it.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
